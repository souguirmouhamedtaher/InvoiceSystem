name: Deploy Invoice Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          if docker build -t invoice-be . ; then
            echo "Docker image invoice-be built successfully."
          else
            echo "Failed to build Docker image invoice-be."
            exit 1
          fi

      - name: Scan image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: invoice-be
          severity: LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true

      - name: Tag and Push Image to Docker Hub
        run: |
          docker tag invoice-be ${{ secrets.DOCKER_USERNAME }}/invoice-be:prod
          docker push ${{ secrets.DOCKER_USERNAME }}/invoice-be:prod

      - name: Deploy to Server
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # Copy compose file to server
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ./compose.yaml $USER@$HOST:~/apps/invoice/backend/
          
          # Deploy on server with nerdctl
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${USER}@${HOST} << 'EOF'
            set -e
            cd ~/apps/invoice/backend/
            
            # Configure nerdctl
            mkdir -p ~/.config/nerdctl
            echo "{\"auths\": {\"https://index.docker.io/v1/\": {\"auth\": \"$(echo -n ${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }} | base64)\"}}}" > ~/.config/nerdctl/nerdctl.toml
            
            # Cleanup old deployment
            nerdctl compose down || true
            nerdctl rmi -f ${{ secrets.DOCKER_USERNAME }}/invoice-be:prod || true
            
            # Deploy new version
            nerdctl login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            nerdctl pull ${{ secrets.DOCKER_USERNAME }}/invoice-be:prod
            nerdctl compose up -d
            
            # Wait for container to be running
            echo "Waiting for container to start..."
            timeout 60s bash -c 'until nerdctl inspect -f "{{.State.Status}}" invoice-be-prod | grep -q "running"; do sleep 5; done' || {
              echo "Container failed to start"
              nerdctl compose logs
              exit 1
            }
            
            # Verify application is accessible
            echo "Verifying application health..."
            sleep 10
            if ! curl --retry 5 --retry-delay 3 --max-time 10 -k -s https://invoice.celestialwavedigital.com/api/docs; then
              echo "Application health check failed - could not reach API"
              nerdctl compose logs
              exit 1
            fi
            
            echo "Deployment successful!"
            nerdctl compose ps
          EOF
