# Nginx configuration for Invoice Backend API
# File: /etc/nginx/sites-available/invoice-api

server {
    listen 80;
    listen [::]:80;
    server_name invoice.celestialwavedigital.com;

    # Redirect HTTP to HTTPS (after certbot setup)
    # Uncomment after running certbot
    # return 301 https://$server_name$request_uri;

    # Proxy to backend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable cache for API
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /api/docs {
        proxy_pass http://localhost:3000/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/invoice-api-access.log;
    error_log /var/log/nginx/invoice-api-error.log;
}

# SSL Configuration (added by certbot)
# After running: sudo certbot --nginx -d invoice.celestialwavedigital.com
# Certbot will automatically add the SSL server block here
