<section class="tva-payments-list">
  <header class="page-header">
    <div>
      <p class="kicker">US-TVA-03</p>
      <h1>Paiements TVA</h1>
      <p class="subtitle">Suivez les paiements de TVA effectues.</p>
    </div>
    <a class="primary" routerLink="/tva-payments/new">Nouveau paiement</a>
  </header>

  <form class="filters" [formGroup]="form">
    <label class="field">
      <span>Mois</span>
      <input type="month" formControlName="month" />
    </label>

    <button class="ghost" type="button" (click)="resetFilters()">Reinitialiser</button>
  </form>

  <div class="state" *ngIf="loading()">Chargement...</div>
  <div class="state error" *ngIf="!loading() && errorMessage()">{{ errorMessage() }}</div>

  <div class="cards" *ngIf="!loading() && !errorMessage()">
    <article class="card" *ngFor="let payment of payments()">
      <div class="card-header">
        <div>
          <h3>{{ payment.month }}</h3>
          <p>Date: {{ payment.paymentDate }}</p>
        </div>
        <span class="pill">{{ payment.amount | number: '1.2-2' }}</span>
      </div>
      <div class="card-body" *ngIf="payment.notes">
        <p>{{ payment.notes }}</p>
      </div>
      <a class="link" [routerLink]="['/tva-payments', payment._id]">Voir detail</a>
    </article>
  </div>

  <footer class="pager" *ngIf="!loading() && !errorMessage()">
    <button class="ghost" type="button" (click)="previousPage()" [disabled]="page() === 1">Precedent</button>
    <span>Page {{ page() }} / {{ totalPages }}</span>
    <button class="ghost" type="button" (click)="nextPage()" [disabled]="page() === totalPages">Suivant</button>
  </footer>
</section>
