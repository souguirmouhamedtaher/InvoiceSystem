<section class="cnss-create">
  <header class="page-header">
    <div>
      <p class="kicker">US-PAIE-03</p>
      <h1>Ajouter un paiement CNSS</h1>
      <p class="subtitle">Enregistrez un paiement CNSS par employe et mois.</p>
    </div>
    <div class="badge">CNSS</div>
  </header>

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid">
      <label class="field">
        <span>Employe</span>
        <select formControlName="employeeId">
          <option value="">Selectionner</option>
          <option *ngFor="let employee of employees()" [value]="employee._id">
            {{ employee.firstName }} {{ employee.lastName }}
          </option>
        </select>
      </label>

      <label class="field">
        <span>Mois</span>
        <input type="month" formControlName="month" />
      </label>

      <label class="field">
        <span>Montant</span>
        <input type="number" min="0" step="0.01" formControlName="amount" />
      </label>

      <label class="field">
        <span>Date de paiement</span>
        <input type="date" formControlName="paymentDate" />
      </label>
    </div>

    <label class="field">
      <span>Notes</span>
      <textarea rows="3" formControlName="notes"></textarea>
    </label>

    <div class="error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <div class="actions">
      <button class="ghost" type="button" [disabled]="saving()" (click)="form.reset()">Effacer</button>
      <button class="primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>
  </form>
</section>
