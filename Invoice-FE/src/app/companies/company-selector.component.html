<section class="company-selector">
  <div class="selector-container">
    <div class="selector-header">
      <h1>Selectionnez une Societe</h1>
      <p>Choisissez la societe que vous souhaitez gerer</p>
    </div>

    <div class="loading" *ngIf="loading()">
      <div class="spinner"></div>
      <p>Chargement de vos societes...</p>
    </div>

    <div class="error-message" *ngIf="error() && !loading()">
      {{ error() }}
    </div>

    <div class="companies-grid" *ngIf="!loading() && companies().length > 0">
      <button
        class="company-card"
        *ngFor="let membership of companies()"
        (click)="selectCompany(membership.companyId._id)"
      >
        <div class="card-header">
          <h2>{{ membership.companyId.companyname }}</h2>
          <p class="company-type">{{ membership.companyId.companyType }}</p>
        </div>
        <div class="card-details">
          <p>Role: {{ membership.role }}</p>
        </div>
        <div class="card-action">
          <span class="select-text">Selectionner</span>
          <span class="arrow">→</span>
        </div>
      </button>
    </div>

    <div class="create-section">
      <button class="create-button" (click)="createNewCompany()">
        <span class="plus-icon">+</span>
        Creer une nouvelle Societe
      </button>
    </div>
  </div>
</section>
