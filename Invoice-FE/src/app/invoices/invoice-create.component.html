<section class="invoice-create" *ngIf="!loading(); else loadingState">
  <header class="page-header">
    <div>
      <p class="kicker">US-VENTE-04</p>
      <h1>Nouvelle facture</h1>
      <p class="subtitle">Saisissez les informations et lignes de facturation.</p>
    </div>
    <a class="ghost" routerLink="/clients">Voir clients</a>
  </header>

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid">
      <label class="field">
        <span>Contact client</span>
        <input type="text" formControlName="username" placeholder="Nom du contact" />
      </label>

      <label class="field">
        <span>Date facture</span>
        <input type="date" formControlName="dateInvoice" />
      </label>

      <label class="field">
        <span>Client</span>
        <select formControlName="clientId">
          <option value="">Selectionner</option>
          <option *ngFor="let client of clients()" [value]="client._id">
            {{ client.companyname }}
          </option>
        </select>
      </label>

      <label class="field">
        <span>Ma societe</span>
        <select formControlName="mycompanyId">
          <option value="">Selectionner</option>
          <option *ngFor="let company of myCompanies()" [value]="company._id">
            {{ company.companyname }}
          </option>
        </select>
      </label>

      <label class="field">
        <span>Type client</span>
        <select formControlName="clientType">
          <option value="national">National</option>
          <option value="international">International</option>
        </select>
      </label>

      <label class="field">
        <span>Mode de paiement</span>
        <select formControlName="paymentType">
          <option value="cash">Especes</option>
          <option value="creditCard">Carte</option>
          <option value="bankTransfer">Virement</option>
          <option value="paypal">PayPal</option>
          <option value="check">Cheque</option>
          <option value="cheque">Cheque (FR)</option>
        </select>
      </label>

      <label class="field">
        <span>Taxe (TVA)</span>
        <select formControlName="taxSettingsId">
          <option value="">Selectionner</option>
          <option *ngFor="let tax of taxes()" [value]="tax._id">
            {{ tax.name }} ({{ tax.taxprice }}%)
          </option>
        </select>
      </label>

      <label class="field">
        <span>Projet / Application</span>
        <input type="text" formControlName="applicationName" placeholder="Ex: ERP 2025" />
      </label>

      <label class="field">
        <span>Timbre</span>
        <input type="number" step="0.01" formControlName="timbre" />
      </label>

    </div>

    <div class="lines" formArrayName="lines">
      <div class="lines-header">
        <h2>Lignes de facturation</h2>
        <button class="ghost" type="button" (click)="addLine()">Ajouter une ligne</button>
      </div>

      <div class="line" *ngFor="let line of lines.controls; let i = index" [formGroupName]="i">
        <label class="field">
          <span>Designation</span>
          <input type="text" formControlName="name" placeholder="Service" />
        </label>

        <label class="field">
          <span>Quantite</span>
          <input type="number" min="1" formControlName="qte" />
        </label>

        <label class="field">
          <span>Prix HT</span>
          <input type="number" min="0" step="0.01" formControlName="prixHT" />
        </label>

        <label class="field">
          <span>Type</span>
          <select formControlName="productType">
            <option value="service">Service</option>
            <option value="product">Produit</option>
            <option value="donation">Don</option>
          </select>
        </label>

        <label class="field">
          <span>Unite</span>
          <select formControlName="unity">
            <option value="article">Article</option>
            <option value="hours">Heures</option>
            <option value="day">Jour</option>
            <option value="month">Mois</option>
            <option value="year">Annee</option>
            <option value="kg">Kg</option>
            <option value="m">Metre</option>
          </select>
        </label>

        <label class="field span-2">
          <span>Description</span>
          <input type="text" formControlName="description" placeholder="Description optionnelle" />
        </label>

        <button class="ghost danger" type="button" (click)="removeLine(i)" [disabled]="lines.length === 1">
          Supprimer
        </button>
      </div>
    </div>

    <label class="field">
      <span>Notes</span>
      <textarea rows="3" formControlName="notes" placeholder="Notes internes"></textarea>
    </label>

    <div class="error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <div class="totals" *ngIf="totals()">
      <div>
        <strong>Total HT</strong>
        <span>{{ totals()?.totalHT }}</span>
      </div>
      <div>
        <strong>TVA</strong>
        <span>{{ totals()?.totalTax }}</span>
      </div>
      <div>
        <strong>Total TTC</strong>
        <span>{{ totals()?.totalTTC_final || totals()?.totalTTC }}</span>
      </div>
    </div>

    <div class="actions">
      <button class="ghost" type="button" (click)="calculateTotals()">Calculer</button>
      <button class="primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Creation...' : 'Creer la facture' }}
      </button>
    </div>
  </form>
</section>

<ng-template #loadingState>
  <section class="invoice-create">
    <div class="form-card">Chargement...</div>
  </section>
</ng-template>
