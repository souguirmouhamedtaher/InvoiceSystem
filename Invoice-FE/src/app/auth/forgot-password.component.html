<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <p class="auth-kicker">Mot de passe oublie</p>
      <h1>Reinitialiser l'acces</h1>
      <p class="auth-subtitle">Nous vous enverrons un lien pour definir un nouveau mot de passe.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="ex: agent@invoice.com" />
        <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Entrez un email valide.
        </small>
      </label>

      <div class="error" *ngIf="errorMessage()">{{ errorMessage() }}</div>
      <div class="success" *ngIf="successMessage()">{{ successMessage() }}</div>

      <button class="primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Envoi...' : 'Envoyer le lien' }}
      </button>

      <div class="helper">
        <span>Vous avez deja un compte ?</span>
        <a routerLink="/login">Se connecter</a>
      </div>
    </form>
  </div>
</section>
