<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <p class="auth-kicker">Nouveau mot de passe</p>
      <h1>Definir un nouveau mot de passe</h1>
      <p class="auth-subtitle">Choisissez un mot de passe securise pour continuer.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span>Mot de passe</span>
        <input type="password" formControlName="newPassword" placeholder="Nouveau mot de passe" />
        <small *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid">
          Le mot de passe est obligatoire (6 caracteres minimum).
        </small>
      </label>

      <div class="error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

      <button class="primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Mise a jour...' : 'Mettre a jour' }}
      </button>

      <div class="helper">
        <span>Retour a la connexion</span>
        <a routerLink="/login">Se connecter</a>
      </div>
    </form>
  </div>
</section>
