<section class="supplier-create">
  <header class="page-header">
    <div>
      <p class="kicker">US-ACHAT-01</p>
      <h1>Creer un fournisseur</h1>
      <p class="subtitle">Ajoutez vos fournisseurs pour gerer vos achats.</p>
    </div>
    <div class="badge">Fournisseur</div>
  </header>

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid">
      <label class="field">
        <span>Raison sociale</span>
        <input type="text" formControlName="name" placeholder="Ex: Atlas Distribution" />
        <small *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
          Ce champ est obligatoire.
        </small>
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="contact@fournisseur.com" />
        <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Entrez un email valide.
        </small>
      </label>

      <label class="field">
        <span>Telephone(s)</span>
        <input type="text" formControlName="phone" placeholder="+21612345678" />
        <small *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
          Ajoutez un numero valide.
        </small>
      </label>

      <label class="field">
        <span>Adresse</span>
        <input type="text" formControlName="address" placeholder="12 Avenue Habib Bourguiba" />
        <small *ngIf="form.get('address')?.touched && form.get('address')?.invalid">
          L'adresse est obligatoire.
        </small>
      </label>

      <label class="field">
        <span>Identifiant fiscal (optionnel)</span>
        <input type="text" formControlName="taxId" placeholder="MF1234567" />
      </label>
    </div>

    <label class="field">
      <span>Notes</span>
      <textarea rows="3" formControlName="notes" placeholder="Notes internes"></textarea>
    </label>

    <div class="error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <div class="actions">
      <button class="ghost" type="button" [disabled]="saving()" (click)="form.reset()">
        Effacer
      </button>
      <button class="primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>
  </form>
</section>
