<section class="client-list">
  <header class="page-header">
    <div>
      <p class="kicker">US-VENTE-02</p>
      <h1>Clients</h1>
      <p class="subtitle">Parcourez votre base clients et retrouvez rapidement une fiche.</p>
    </div>
    <a class="primary" routerLink="/clients/new">Nouveau client</a>
  </header>

  <form class="filters" [formGroup]="form">
    <label class="field">
      <span>Recherche</span>
      <input type="text" formControlName="search" placeholder="Nom, email" />
    </label>

    <button class="ghost" type="button" (click)="resetFilters()">Reinitialiser</button>
  </form>

  <div class="state" *ngIf="loading()">Chargement...</div>
  <div class="state error" *ngIf="!loading() && errorMessage()">{{ errorMessage() }}</div>

  <div class="cards" *ngIf="!loading() && !errorMessage()">
    <article class="card" *ngFor="let client of clients()">
      <div class="card-header">
        <div>
          <h3>{{ client.name }}</h3>
          <p>{{ client.email }}</p>
        </div>
      </div>
      <div class="card-body">
        <p>{{ client.address }}</p>
        <p>{{ client.phone }}</p>
        <p *ngIf="client.taxId">{{ client.taxId }}</p>
      </div>
      <a class="link" [routerLink]="['/clients', client._id]">Voir fiche</a>
    </article>
  </div>

  <footer class="pager" *ngIf="!loading() && !errorMessage()">
    <button class="ghost" type="button" (click)="previousPage()" [disabled]="page() === 1">Precedent</button>
    <span>Page {{ page() }} / {{ totalPages }}</span>
    <button class="ghost" type="button" (click)="nextPage()" [disabled]="page() === totalPages">Suivant</button>
  </footer>
</section>
