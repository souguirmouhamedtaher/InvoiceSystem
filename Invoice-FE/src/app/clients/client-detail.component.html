<section class="client-detail" *ngIf="client(); else loading">
  <header>
    <p class="kicker">Fiche client</p>
    <h1>{{ client()?.name }}</h1>
    <p class="subtitle">Client cree avec succes.</p>
  </header>

  <div class="card-grid">
    <article class="card">
      <h3>Contact principal</h3>
      <p>{{ client()?.email }}</p>
      <p>{{ client()?.phone }}</p>
      <p *ngIf="client()?.taxId">{{ client()?.taxId }}</p>
    </article>

    <article class="card">
      <h3>Adresse</h3>
      <p>{{ client()?.address }}</p>
    </article>

    <article class="card" *ngIf="client()?.notes">
      <h3>Notes</h3>
      <p>{{ client()?.notes }}</p>
    </article>
  </div>

  <div class="actions">
    <a [routerLink]="['/clients', client()?._id, 'edit']" class="primary">Modifier</a>
    <a routerLink="/clients/new" class="ghost">Ajouter un autre client</a>
    <button type="button" class="ghost danger" (click)="deleteClient()">Supprimer</button>
  </div>
</section>

<ng-template #loading>
  <section class="client-detail">
    <div class="card" *ngIf="errorMessage(); else spinner">{{ errorMessage() }}</div>
    <ng-template #spinner>
      <div class="card">Chargement...</div>
    </ng-template>
  </section>
</ng-template>
