<div class="app-shell">
  <header class="topbar" *ngIf="auth.isLoggedIn()">
    <div class="brand">
      <span class="brand-mark">Invoice</span>
      <span class="brand-sub">Studio</span>
    </div>

    <nav class="nav">
      <a routerLink="/clients" routerLinkActive="active">Clients</a>
      <a routerLink="/clients/new" routerLinkActive="active">Nouveau client</a>
      <a routerLink="/suppliers" routerLinkActive="active">Fournisseurs</a>
      <a routerLink="/suppliers/new" routerLinkActive="active">Nouveau fournisseur</a>
      <a routerLink="/my-companies" routerLinkActive="active">Mes societes</a>
      <a routerLink="/tax-settings/new" routerLinkActive="active">Taxe</a>
      <a routerLink="/tva-monthly" routerLinkActive="active">TVA mensuelle</a>
      <a routerLink="/invoices" routerLinkActive="active">Factures</a>
      <a routerLink="/invoices/new" routerLinkActive="active">Nouvelle facture</a>
    </nav>

    <div class="auth">
      <span class="status">Connecte</span>
      <button class="ghost" type="button" (click)="logout()">Se deconnecter</button>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
