<div class="app-shell" [class.has-sidebar]="auth.isLoggedIn() && !isAuthRoute()">
  <aside class="sidebar" *ngIf="auth.isLoggedIn() && !isAuthRoute()">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-icon">📋</span>
        <div class="brand-text">
          <span class="brand-mark">Invoice</span>
          <span class="brand-sub">Studio</span>
        </div>
      </div>
    </div>

    <div class="company-selector-compact">
      <app-company-switcher></app-company-switcher>
    </div>

    <nav class="sidebar-nav">
      <!-- Dashboard -->
      <div class="nav-section">
        <a class="nav-item nav-primary" routerLink="/dashboard" routerLinkActive="active">
          <span class="nav-icon">📈</span>
          <span class="nav-label">Dashboard</span>
        </a>
      </div>

      <!-- Invoices Section -->
      <div class="nav-section">
        <a class="nav-item nav-primary" routerLink="/invoices" routerLinkActive="active">
          <span class="nav-icon">📄</span>
          <span class="nav-label">Invoices</span>
        </a>
        <a class="nav-item nav-secondary" routerLink="/invoices/new" routerLinkActive="active">
          <span class="nav-icon">➕</span>
          <span class="nav-label">New Invoice</span>
        </a>
        <a class="nav-item nav-secondary" routerLink="/invoices/buying" routerLinkActive="active">
          <span class="nav-icon">📥</span>
          <span class="nav-label">Purchase Invoices</span>
        </a>
      </div>

      <!-- Contacts Section -->
      <div class="nav-section">
        <a class="nav-item nav-primary" routerLink="/clients" routerLinkActive="active">
          <span class="nav-icon">👥</span>
          <span class="nav-label">Customers</span>
        </a>
        <a class="nav-item nav-secondary" routerLink="/clients/new" routerLinkActive="active">
          <span class="nav-icon">➕</span>
          <span class="nav-label">New Customer</span>
        </a>
        <a class="nav-item nav-primary" routerLink="/suppliers" routerLinkActive="active">
          <span class="nav-icon">🏢</span>
          <span class="nav-label">Suppliers</span>
        </a>
        <a class="nav-item nav-secondary" routerLink="/suppliers/new" routerLinkActive="active">
          <span class="nav-icon">➕</span>
          <span class="nav-label">New Supplier</span>
        </a>
      </div>

      <!-- HR Section -->
      <div class="nav-section">
        <a class="nav-item nav-primary" routerLink="/employees" routerLinkActive="active">
          <span class="nav-icon">👨‍💼</span>
          <span class="nav-label">Employees</span>
        </a>
      </div>

      <!-- Tax Section -->
      <div class="nav-section">
        <a class="nav-item nav-primary" routerLink="/tva-monthly" routerLinkActive="active">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Monthly VAT</span>
        </a>
        <a class="nav-item nav-secondary" routerLink="/tva-payments" routerLinkActive="active">
          <span class="nav-icon">💳</span>
          <span class="nav-label">VAT Payments</span>
        </a>
        <a class="nav-item nav-secondary" routerLink="/tax-settings/new" routerLinkActive="active">
          <span class="nav-icon">%</span>
          <span class="nav-label">New Tax (TVA)</span>
        </a>
      </div>

      <!-- My Companies: super admin only (create/manage companies) -->
      <div class="nav-section" *ngIf="isSuperAdmin()">
        <a class="nav-item nav-primary" routerLink="/my-companies" routerLinkActive="active">
          <span class="nav-icon">🏛️</span>
          <span class="nav-label">My Companies</span>
        </a>
      </div>
      <!-- Team Members: owner only -->
      <div class="nav-section" *ngIf="isOwnerContext()">
        <a class="nav-item nav-primary" routerLink="/admin/company-memberships" routerLinkActive="active">
          <span class="nav-icon">🔐</span>
          <span class="nav-label">Team Members</span>
        </a>
      </div>
      <div class="nav-section">
        <a class="nav-item nav-primary" routerLink="/admin/audit-logs" routerLinkActive="active">
          <span class="nav-icon">📜</span>
          <span class="nav-label">Audit Log</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" type="button" (click)="logout()">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
